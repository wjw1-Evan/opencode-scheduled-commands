name: Auto-tag version

# 在每次 push 到 main 时检查 package.json 的版本号是否已有对应 tag（vX.Y.Z）。
# 没有则自动创建该 tag，并显式触发 npm-publish 工作流——
# GitHub 的 push 事件不会因 REST API 创建的 tag 而触发（2026-08-15 实测），
# 所以必须在创建 tag 后主动 dispatch npm-publish，否则发布会卡住。
# 推 tag 的事件不会命中本工作流（只监听 main 分支），不会产生循环触发。
# 也可在 Actions 页面手动运行，为现有提交补打缺失的版本 tag。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-create missing version tag
        id: auto-tag
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs")
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const tag = `v${version}`
            const repo = context.repo
            try {
              await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })
              console.log(`Tag ${tag} already exists — nothing to do`)
              return "exists"
            } catch (e) {
              if (e.status !== 404) throw e
              try {
                await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha })
                console.log(`Created missing version tag ${tag}`)
                return "created"
              } catch (e2) {
                if (e2.status === 422) {
                  console.log(`Tag ${tag} was just created by a concurrent run`)
                  return "exists"
                }
                throw e2
              }
            }

      - name: Trigger npm publish workflow
        # API 创建的 tag 不触发 push 事件，必须显式 dispatch（tag 已存在时也无需再发）
        if: steps.auto-tag.outputs.result == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-publish.yml --ref main
